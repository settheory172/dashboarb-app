name: Pruebas del Dashboard y UI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio
    - name: Checkout repositorio
      uses: actions/checkout@v4

    # 2. Configura Python en la nube de GitHub
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    # 3. Instala tus dependencias del requirements.txt
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Ejecuta pytest (correrá tanto test_metrics.py como test_ui_ranking.py)
    - name: Ejecutar pytest con AppTest
      run: |
        pytest
